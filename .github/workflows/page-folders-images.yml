name: Publish Page Folders images

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Versioned image tag
        required: true
        default: v1.3.0-folders.1
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: page-folders-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  metadata:
    name: Resolve image metadata
    runs-on: ubuntu-22.04
    outputs:
      owner: ${{ steps.owner.outputs.value }}
    steps:
      - id: owner
        name: Normalize registry owner
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: echo "value=${REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

  frontend:
    name: Build and publish frontend
    needs: metadata
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/web/Dockerfile.web
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ needs.metadata.outputs.owner }}/plane-frontend:${{ inputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=AGPL-3.0-only
          cache-from: type=gha,scope=page-folders-frontend
          cache-to: type=gha,mode=max,scope=page-folders-frontend

  backend:
    name: Build and publish backend
    needs: metadata
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: ./apps/api
          file: ./apps/api/Dockerfile.api
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ needs.metadata.outputs.owner }}/plane-backend:${{ inputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=AGPL-3.0-only
          cache-from: type=gha,scope=page-folders-backend
          cache-to: type=gha,mode=max,scope=page-folders-backend
